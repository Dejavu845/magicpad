name: linux-checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Repo lint (syntax, invariants, forbidden files)
        run: bash scripts/lint-repo.sh
      - name: Client HTML checks
        run: python3 scripts/check-html.py MagicPadClient/index.html
      - name: Protocol unit tests (stdlib)
        run: python3 -m unittest scripts/test-protocol.py scripts/test_cycle21_qr.py scripts/test_cycle23_stt.py scripts/test_cycle24_stt_lang.py scripts/test_cycle25_stt_ondevice.py scripts/test_cycle26_binary.py scripts/test_cycle27_wstype.py scripts/test_cycle28_lan.py scripts/test_cycle29_health_pair.py scripts/test_cycle30_classify.py scripts/test_cycle31_lan_fixtures.py scripts/test_cycle32_classify_health.py scripts/test_cycle33_classify_http.py scripts/test_cycle34_qr_classify.py scripts/test_cycle35_print_only.py scripts/test_cycle36_http_routes.py scripts/test_cycle37_http_path.py -v
      - name: Baked-IP / QR invariants
        run: python3 scripts/generate_qr.py --print-only --http
