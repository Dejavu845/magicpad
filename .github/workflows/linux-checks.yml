name: linux-checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Repo lint (syntax, invariants, forbidden files)
        run: ./scripts/lint-repo.sh
      - name: Client HTML checks
        run: python3 scripts/check-html.py MagicPadClient/index.html
      - name: Protocol unit tests (stdlib)
        run: python3 -m unittest scripts/test-protocol.py -v
      - name: Baked-IP / QR invariants
        run: python3 scripts/generate_qr.py --print-only --http
